<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="opt3BgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1" />
      <stop offset="50%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#90CAF9" />
    </linearGradient>

    <linearGradient id="opt3Loop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#90CAF9" />
    </linearGradient>

    <linearGradient id="opt3Loop2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90CAF9" />
      <stop offset="100%" stop-color="#E3F2FD" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="128" fill="url(#opt3BgGrad)" />

  <!-- Background Soft Radial Ring -->
  <circle cx="256" cy="256" r="180" stroke="#90CAF9" stroke-width="2" opacity="0.4" stroke-dasharray="8 8" />

  <!-- Infinity Loop (Continuous Care & Riwayat Rangkul) -->
  <!-- Left Loop (Family / Helper) -->
  <path d="M 256 256 C 210 180, 130 180, 130 256 C 130 332, 210 332, 256 256 Z" 
        fill="none" stroke="url(#opt3Loop1)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Loop (Lansia / Care) -->
  <path d="M 256 256 C 302 332, 382 332, 382 256 C 382 180, 302 180, 256 256 Z" 
        fill="none" stroke="url(#opt3Loop2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Overlapping Central Loving Node -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" />
  
  <!-- Heart Symbol inside center node -->
  <path d="M 256 244 C 250 236, 238 236, 234 244 C 230 252, 240 262, 256 274 C 272 262, 282 252, 278 244 C 274 236, 262 236, 256 244 Z" 
        fill="#0D47A1" />

  <!-- Top Protective Dot / Star -->
  <circle cx="256" cy="148" r="12" fill="#ffffff" />
  <circle cx="256" cy="364" r="12" fill="#90CAF9" />
</svg>
