<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rangkulPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1" />
      <stop offset="50%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#90CAF9" />
    </linearGradient>

    <linearGradient id="rangkulAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90CAF9" />
      <stop offset="100%" stop-color="#E3F2FD" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark Group (Left side, scale and translate) -->
  <g transform="translate(20, 20)">
    <!-- Container -->
    <rect width="200" height="200" rx="50" fill="url(#rangkulPrimaryGrad)" />
    
    <!-- Outer Curve -->
    <path d="M 62 136 C 39 113, 43 70, 78 51 C 101 37, 129 43, 140 62 C 146 72, 144 84, 134 88 C 125 92, 115 86, 111 78 C 103 64, 84 60, 68 70 C 48 82, 47 109, 64 125 C 72 132, 72 142, 62 136 Z" 
          fill="#ffffff" 
          opacity="0.95" />

    <!-- Inner Curve -->
    <path d="M 137 63 C 160 86, 156 129, 121 148 C 98 162, 70 156, 59 137 C 53 127, 55 115, 65 111 C 74 107, 84 113, 88 121 C 96 135, 115 139, 131 129 C 151 117, 152 90, 135 74 C 127 67, 127 57, 137 63 Z" 
          fill="url(#rangkulAccentGrad)" />

    <!-- Center Heart -->
    <path d="M 100 86 C 94 76, 80 76, 76 86 C 72 96, 82 107, 100 121 C 118 107, 128 96, 124 86 C 120 76, 106 76, 100 86 Z" 
          fill="#ffffff" 
          filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <text x="250" y="135" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="92" fill="#0D47A1" letter-spacing="-2">Rangkul</text>
  
  <!-- Tagline -->
  <text x="254" y="175" font-family="'Instrument Sans', 'Inter', system-ui, sans-serif" font-weight="500" font-size="22" fill="#546E7A" letter-spacing="0.2">Merangkul Jarak, Menjaga yang Tersayang</text>
</svg>
