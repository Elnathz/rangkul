name: Rangkul Scheduled Jobs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  task-and-payment-maintenance:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Validate scheduled job secrets
        run: |
          missing=""
          if [ -z "$SUPABASE_PROJECT_ID" ]; then missing="$missing SUPABASE_PROJECT_ID"; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing="$missing SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            echo "Add the missing secrets to the production environment or repository settings."
            exit 1
          fi

      - name: Expire pending tasks
        run: |
          curl --fail --silent --show-error \
            -X POST \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/rest/v1/rpc/expire_pending_tasks" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}'

      - name: Auto-release held payments
        run: |
          curl --fail --silent --show-error \
            -X POST \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/rest/v1/rpc/auto_release_held_payments" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}'
